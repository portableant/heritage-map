<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accredited Museums Map | Antiquities Database</title>

    <!-- Anti-FOUC Theme Preloader -->
    <script>
        (function () {
            const storedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700,800|inter:400,500,600,700|jet-brains-mono:400,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./src/css/app.css" />
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-100 text-slate-900 dark:bg-[#090d16] dark:text-[#f1f5f9] antialiased selection:bg-blue-600 selection:text-white">

    <!-- Header Bar -->
    <header class="h-14 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-3">
            <a href="./" class="w-8 h-8 rounded-lg bg-slate-900 dark:bg-slate-800 flex items-center justify-center text-white shadow-xs shrink-0">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
                </svg>
            </a>
            <a href="./" class="font-heading font-extrabold text-blue-600 dark:text-blue-400 tracking-tight text-base hover:text-blue-500 transition-colors">
                Antiquities Database
            </a>
            <span class="text-slate-300 dark:text-slate-700">/</span>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Museums Map</span>
        </div>

        <nav class="flex items-center gap-3">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle-btn" type="button" aria-label="Toggle dark/light theme" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <svg id="theme-icon-light" class="w-4 h-4 hidden dark:block text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                </svg>
                <svg id="theme-icon-dark" class="w-4 h-4 block dark:hidden text-slate-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                </svg>
            </button>
            <a href="https://github.com/portableant/heritage-map" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 hover:border-blue-500 text-slate-700 dark:text-slate-200 transition">
                GitHub
            </a>
        </nav>
    </header>

    <!-- Main Workspace -->
    <main class="relative flex-1 w-full h-full overflow-hidden">
        <div class="relative w-full h-full">

            <!-- Skip Link -->
            <a href="#map" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:font-semibold focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Skip to interactive map
            </a>

            <!-- Floating Control Panel -->
            <div class="absolute top-4 left-4 z-10 w-84 max-h-[calc(100vh-5.5rem)] flex flex-col bg-white/95 dark:bg-slate-900/90 backdrop-blur-md rounded-2xl p-4 shadow-xl dark:shadow-2xl border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200 transition-colors"
                 role="region" 
                 aria-label="Map filters and controls">
                
                <!-- Search -->
                <div class="relative">
                    <label for="map-search-input" class="sr-only">Search museum by name or postcode</label>
                    <input 
                        type="text" 
                        id="map-search-input" 
                        placeholder="Search museum, postcode..."
                        class="w-full text-xs bg-slate-50 dark:bg-slate-950/80 rounded-xl border border-slate-300 dark:border-slate-800 pl-9 pr-3 py-2 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:focus-visible:ring-blue-400 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900 transition-all"
                    >
                    <svg class="w-4 h-4 text-slate-400 dark:text-slate-500 absolute left-3 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>

                <!-- Collapsible Controls -->
                <div class="mt-3">
                    <button 
                        type="button" 
                        id="btn-toggle-filters" 
                        aria-expanded="false" 
                        aria-controls="advanced-filters-panel"
                        class="flex items-center justify-between w-full text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded transition-colors"
                    >
                        <span>Advanced Query Filters</span>
                        <span id="filters-chevron" aria-hidden="true" class="text-xs transition-transform duration-200">&darr;</span>
                    </button>
                </div>

                <!-- Expandable Filter Panel -->
                <div id="advanced-filters-panel" class="hidden mt-3 pt-3 border-t border-slate-200 dark:border-slate-800 space-y-3 text-xs overflow-y-auto pr-1">
                    
                    <!-- Proximity Radius -->
                    <div class="p-3 bg-slate-50 dark:bg-slate-950/80 rounded-xl border border-slate-200 dark:border-slate-800/80 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400">Proximity Radius</span>
                            <button 
                                type="button" 
                                id="btn-use-location" 
                                aria-label="Use my current GPS position as proximity origin"
                                class="inline-flex items-center gap-1 text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>Near Me</span>
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <label for="filter-radius" class="sr-only">Choose proximity distance</label>
                            <select id="filter-radius" class="w-full text-xs bg-white dark:bg-slate-900 rounded-lg border border-slate-300 dark:border-slate-800 p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                <option value="">Disabled (View all in bounds)</option>
                                <option value="5">Within 5 km</option>
                                <option value="10">Within 10 km</option>
                                <option value="25">Within 25 km</option>
                                <option value="50">Within 50 km</option>
                                <option value="100">Within 100 km</option>
                            </select>
                            <button 
                                type="button" 
                                id="btn-clear-proximity" 
                                class="hidden p-2 text-slate-400 hover:text-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 rounded transition-colors" 
                                aria-label="Clear proximity radius"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <div id="proximity-status" class="hidden text-[10px] text-slate-500 dark:text-slate-400 font-mono" role="status" aria-live="polite"></div>
                    </div>

                    <!-- Historic England Layers -->
                    <div class="p-3 bg-slate-50 dark:bg-slate-950/80 rounded-xl border border-slate-200 dark:border-slate-800/80 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400">Historic England Layers</span>
                            <span id="he-status" class="text-[10px] text-blue-600 dark:text-blue-400 font-mono"></span>
                        </div>
                        
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="layer-listed-buildings" class="rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-amber-600 focus:ring-amber-500">
                            <span class="text-xs text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-sm bg-amber-500 inline-block" aria-hidden="true"></span>
                                Listed Buildings
                            </span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="layer-scheduled-monuments" class="rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-red-600 focus:ring-red-500">
                            <span class="text-xs text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block" aria-hidden="true"></span>
                                Scheduled Monuments
                            </span>
                        </label>
                    </div>

                    <!-- Filters populated dynamically by JS -->
                    <div>
                        <label for="filter-status" class="block text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Accreditation Status</label>
                        <select id="filter-status" class="w-full text-xs bg-slate-50 dark:bg-slate-950/80 rounded-lg border border-slate-300 dark:border-slate-800 p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-all">
                            <option value="">All Statuses</option>
                        </select>
                    </div>

                    <div>
                        <label for="filter-county" class="block text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                            County Boundary (OS)
                        </label>
                        <select id="filter-county" class="w-full text-xs bg-slate-50 dark:bg-slate-950/80 rounded-lg border border-slate-300 dark:border-slate-800 p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-all">
                            <option value="">All Counties</option>
                        </select>
                    </div>

                    <div>
                        <label for="filter-region" class="block text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Region</label>
                        <select id="filter-region" class="w-full text-xs bg-slate-50 dark:bg-slate-950/80 rounded-lg border border-slate-300 dark:border-slate-800 p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-all">
                            <option value="">All Regions</option>
                        </select>
                    </div>
                </div>

                <!-- Status Output -->
                <div class="mt-3.5 pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
                    <span id="point-counter" role="status" aria-live="polite" class="font-medium text-slate-700 dark:text-slate-300">Ready</span>
                    <span id="loading-indicator" role="status" aria-live="assertive" class="hidden text-blue-600 dark:text-blue-400 font-semibold flex items-center gap-1.5">
                        <svg class="animate-spin h-3.5 w-3.5 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Syncing viewport...</span>
                    </span>
                </div>

                <div class="mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-[10px] text-slate-400">
                    <span>Projection: <strong class="text-slate-700 dark:text-slate-300 font-mono">WGS84</strong></span>
                    <button type="button" id="btn-fit-bounds" class="text-blue-600 dark:text-blue-400 hover:underline font-semibold hidden focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded transition-colors">
                        Zoom to points
                    </button>
                </div>

                <!-- Viewport BBox Readout -->
                <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800 text-[10px] font-mono text-slate-500 dark:text-slate-400">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[9px] uppercase tracking-wider font-bold text-slate-400 dark:text-slate-500">Spatial Bounding Box</span>
                        <span id="active-county-badge" class="hidden text-[9px] font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-1.5 py-0.5 rounded border border-indigo-200 dark:border-indigo-800"></span>
                    </div>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-1 bg-slate-50 dark:bg-slate-950/70 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800/80 text-slate-700 dark:text-slate-300">
                        <div>N: <span id="bbox-north" class="font-bold text-slate-900 dark:text-slate-100">-</span></div>
                        <div>S: <span id="bbox-south" class="font-bold text-slate-900 dark:text-slate-100">-</span></div>
                        <div>E: <span id="bbox-east" class="font-bold text-slate-900 dark:text-slate-100">-</span></div>
                        <div>W: <span id="bbox-west" class="font-bold text-slate-900 dark:text-slate-100">-</span></div>
                    </div>
                </div>
            </div>

            <!-- Legend -->
            <div class="absolute bottom-6 left-4 z-10 hidden sm:flex items-center gap-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-[11px] shadow-md text-slate-700 dark:text-slate-300"
                 role="region" 
                 aria-label="Map status legend">
                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Legend:</span>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[9px] font-bold" aria-hidden="true">&#x25CF;</span>
                    <span>Full Accreditation</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-sm bg-amber-500 text-white flex items-center justify-center text-[9px] font-bold" aria-hidden="true">&#x25B2;</span>
                    <span>Provisional</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-md bg-blue-500 text-white flex items-center justify-center text-[9px] font-bold" aria-hidden="true">&#x25A0;</span>
                    <span>Other</span>
                </div>
                <div class="flex items-center gap-1.5 border-l border-slate-200 dark:border-slate-700 pl-2">
                    <span class="w-3 h-1.5 rounded-sm bg-indigo-500 inline-block" aria-hidden="true"></span>
                    <span>County Border</span>
                </div>
            </div>

            <!-- Map Canvas -->
            <div id="map" 
                 role="region" 
                 aria-label="Interactive Accredited Museums spatial map"
                 tabindex="0"
                 class="w-full h-full bg-slate-100 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-600">
            </div>
        </div>
    </main>

    <script type="module" src="./src/js/map.js"></script>
</body>
</html>
